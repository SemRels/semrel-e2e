name: e2e

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Checks out semrel-e2e plus every plugin repo it needs as siblings, matching
# the workspace layout scripts/common.sh expects (../semrel, ../updater-npm,
# ...), then runs the full local/safe scenario suite. External/credentialed
# scenarios (13, 14, 20) stay skipped here since no SEMREL_E2E_* env vars
# are set on this runner.
# This code has been partially generated by an AI.
jobs:
  scenarios:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          path: semrel-e2e

      - uses: actions/setup-go@v7
        with:
          go-version: "1.27"

      - uses: actions/setup-node@v7
        with:
          node-version: "20"

      - name: Checkout sibling plugin repos
        run: |
          set -euo pipefail
          repos="semrel analyzer-conventional analyzer-default condition-generic \
            condition-bitbucket-pipelines condition-circleci \
            condition-github-actions condition-gitlab-ci condition-gitea-actions \
            provider-github provider-git provider-gitlab provider-gitea provider-bitbucket \
            generator-changelog-md generator-changelog-html \
            generator-release-notes updater-npm updater-go updater-cargo \
            updater-composer updater-pubspec updater-zig \
            updater-python updater-maven updater-gradle updater-nuget \
            updater-terraform updater-helm updater-homebrew updater-docker updater-replace \
            hook-discord hook-exec hook-gitplugin hook-slack hook-teams hook-matrix hook-email hook-jira \
            publisher-crates publisher-docker publisher-generic-http publisher-npm publisher-oci publisher-pypi \
            packager-nfpm plugin-template"
          for r in $repos; do
            git clone "https://github.com/SemRels/$r.git" "$r"
            if git -C "$r" show-ref --verify --quiet refs/remotes/origin/feat/dry-run-plugin-contract; then
              git -C "$r" checkout feat/dry-run-plugin-contract
            elif git -C "$r" show-ref --verify --quiet refs/remotes/origin/feat/dry-run-contract; then
              git -C "$r" checkout feat/dry-run-contract
            fi
          done

      - name: Install nfpm (for scenario 11)
        run: go install github.com/goreleaser/nfpm/v2/cmd/nfpm@latest

      - name: Run e2e scenarios
        working-directory: semrel-e2e
        run: bash scripts/run-all.sh
